version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/taskdb
      REDIS_URL: redis://redis:6379/0
      FLASK_APP: run.py
    ports:
      - "5000:5000"
    command: >
      sh -c "flask db upgrade &&
             flask run --host=0.0.0.0 --port=5000"

  worker:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/taskdb
      REDIS_URL: redis://redis:6379/0
    command: python worker.py

volumes:
  postgres_data: